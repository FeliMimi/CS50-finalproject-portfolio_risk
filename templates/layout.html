<!DOCTYPE html>

<html lang="en">

<head>
    <!--- Meta-Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monte Carlo Portfolio Risk Analysis{% endblock %}</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <!-- Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
    crossorigin="anonymous">
    
    {% block head %}{% endblock %}
</head>
<body>
    <header class="text-center bg-light py-4 mb-4">
        <h1>Monte Carlo Portfolio Risk Analysis</h1>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="bg-light text-center text-muted py-3 mt-auto border-top">
        <p>&copy; Monte Carlo Risk Analysis Project</p>
    </footer>

</body>
</html>
